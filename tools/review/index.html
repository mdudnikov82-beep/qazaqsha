<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Студия проверки Qazaqsha</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: topic rail on the left, one long list of word rows; the row in focus is the workbench. */
:root {
  --bg: #F3F6F5; --panel: #FFFFFF; --ink: #13232E; --muted: #5E717A;
  --line: #DCE5E3; --brand: #0E7C86; --brand-soft: #DDF0F0;
  --ok: #1B7F4E; --ok-soft: #DDF2E6; --fix: #B26A00; --fix-soft: #FBEBD2;
  --rec: #C8372D; --gold: #F5B800;
  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1A20; --panel: #16242C; --ink: #E7EEF0; --muted: #93A6AE;
    --line: #26363F; --brand: #43B7C0; --brand-soft: #173A40;
    --ok: #4CC78A; --ok-soft: #173A2A; --fix: #F0A740; --fix-soft: #3A2C15;
    --rec: #F0645A; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); display: grid; grid-template-columns: 290px 1fr; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 12px; background: var(--panel); }
aside h1 { font-size: 19px; margin: 0 8px 2px; font-weight: 800; }
.total { margin: 0 8px 14px; color: var(--muted); font-size: 13px; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin: 6px 8px 16px; }
.meter i { display: block; height: 100%; }
.meter .ok { background: var(--ok); } .meter .fx { background: var(--fix); }
.topics { display: grid; gap: 2px; }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 10px; }
.topic:hover { background: var(--bg); }
.topic[aria-current="true"] { background: var(--brand-soft); }
.topic b { font-weight: 600; font-size: 14px; }
.topic span { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.topic .bar { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.topic .bar i { display: block; height: 100%; background: var(--ok); }

main { overflow-y: auto; padding: 0 28px 120px; min-width: 0; }
header { position: sticky; top: 0; background: var(--bg); padding: 18px 0 12px; z-index: 2; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; border-bottom: 1px solid var(--line); }
header h2 { margin: 0; font-size: 24px; font-weight: 800; text-wrap: balance; }
header .kk { color: var(--brand); font-weight: 600; }
.keys { width: 100%; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--panel); }
.filters { display: flex; gap: 6px; margin-left: auto; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 11px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

ol { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--panel); border: 2px solid transparent; }
.row.sel { border-color: var(--brand); }
.row .n { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.row .ru { color: var(--muted); }
.row .ru small { display: block; font-size: 12px; opacity: .85; }
.row .kkw { font-size: 19px; font-weight: 800; }
.row .kkw del { color: var(--muted); font-weight: 400; font-size: 14px; margin-right: 6px; }
.row .note { display: block; font-size: 12.5px; color: var(--fix); font-weight: 400; }
.row.ok { background: var(--ok-soft); }
.row.fix { background: var(--fix-soft); }
.acts { display: flex; gap: 6px; align-items: center; }
.ib { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; font-size: 16px; }
.ib.on-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.ib.on-fix { background: var(--fix); border-color: var(--fix); color: #fff; }
.ib.has { color: var(--brand); border-color: var(--brand); }
.ib.rec { background: var(--rec); border-color: var(--rec); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .ib.rec { animation: none; } }

form.edit { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
form.edit label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
form.edit input { font: inherit; font-size: 15px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
form.edit .wide { grid-column: 1 / -1; }
form.edit .btns { grid-column: 1 / -1; display: flex; gap: 8px; }
.btn { border-radius: 9px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.btn.primary { background: var(--fix); border-color: var(--fix); color: #fff; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; }
.empty { padding: 40px 0; color: var(--muted); }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 0 16px 120px; }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .n { display: none; }
  .row .kkw { grid-column: 1; }
  .acts { grid-column: 2; grid-row: 1 / span 2; flex-wrap: wrap; justify-content: flex-end; }
}
</style>
</head>
<body>
<aside>
  <h1>Студия проверки</h1>
  <p class="total" id="total">Загружаю словарь…</p>
  <div class="meter" id="meter"></div>
  <nav class="topics" id="topics"></nav>
</aside>
<main>
  <header>
    <h2 id="title">…</h2>
    <span class="kk" id="titleKk"></span>
    <div class="filters" role="group" aria-label="Показать">
      <button class="chip" data-f="all" aria-pressed="true">Все</button>
      <button class="chip" data-f="todo" aria-pressed="false">Не проверены</button>
      <button class="chip" data-f="noaudio" aria-pressed="false">Без голоса</button>
      <button class="chip" data-f="fix" aria-pressed="false">С правкой</button>
    </div>
    <div class="keys">
      <span><kbd>↑</kbd><kbd>↓</kbd> слово</span>
      <span><kbd>Enter</kbd> верно и дальше</span>
      <span><kbd>E</kbd> исправить</span>
      <span><kbd>R</kbd> запись, ещё раз <kbd>R</kbd> — стоп и дальше</span>
      <span><kbd>P</kbd> прослушать</span>
      <span><kbd>U</kbd> снять отметку</span>
    </div>
  </header>
  <ol id="list"></ol>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const state = { cats: [], review: {}, audio: new Set(), cat: 0, sel: 0, filter: 'all', editing: null };
const $ = (id) => document.getElementById(id);
let recorder = null, recKey = null, chunks = [], stream = null, player = new Audio();

function toast(text) {
  const t = $('toast'); t.textContent = text; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800);
}

async function load() {
  const res = await fetch('/api/data');
  const data = await res.json();
  state.cats = data.dictionary.categories;
  state.review = data.review;
  state.audio = new Set(data.audio);
  try { state.cat = Math.min(+localStorage.getItem('cat') || 0, state.cats.length - 1); } catch {}
  render();
}

const key = (c, i) => `${state.cats[c].id}-${i}`;

function rows() {
  const c = state.cat;
  return state.cats[c].words.map((w, i) => ({ w, i, k: key(c, i) })).filter(({ k }) => {
    const r = state.review[k];
    switch (state.filter) {
      case 'todo': return !r;
      case 'noaudio': return !state.audio.has(k);
      case 'fix': return r?.status === 'fix';
      default: return true;
    }
  });
}

function counts(c) {
  let ok = 0, fix = 0, rec = 0;
  state.cats[c].words.forEach((_, i) => {
    const k = key(c, i), r = state.review[k];
    if (r?.status === 'ok') ok++; else if (r?.status === 'fix') fix++;
    if (state.audio.has(k)) rec++;
  });
  return { ok, fix, rec, all: state.cats[c].words.length };
}

function render() {
  let all = 0, ok = 0, fix = 0, rec = 0;
  const nav = $('topics'); nav.textContent = '';
  state.cats.forEach((cat, c) => {
    const n = counts(c); all += n.all; ok += n.ok; fix += n.fix; rec += n.rec;
    const b = document.createElement('button');
    b.className = 'topic'; b.setAttribute('aria-current', c === state.cat);
    b.innerHTML = '<b></b><span></span><div class="bar"><i></i></div>';
    b.querySelector('b').textContent = cat.ru;
    b.querySelector('span').textContent = `${n.ok + n.fix}/${n.all} · 🎙${n.rec}`;
    b.querySelector('i').style.width = `${100 * (n.ok + n.fix) / n.all}%`;
    b.onclick = () => { state.cat = c; state.sel = 0; state.editing = null; try { localStorage.setItem('cat', c); } catch {} render(); main().scrollTop = 0; };
    nav.append(b);
  });
  $('total').textContent = `Проверено ${ok + fix} из ${all} · правок ${fix} · записано ${rec}`;
  $('meter').innerHTML = `<i class="ok" style="width:${100 * ok / all}%"></i><i class="fx" style="width:${100 * fix / all}%"></i>`;
  const cat = state.cats[state.cat];
  $('title').textContent = cat.ru; $('titleKk').textContent = cat.kk;
  document.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', b.dataset.f === state.filter));
  renderList();
}

function renderList() {
  const list = $('list'); list.textContent = '';
  const items = rows();
  state.sel = Math.max(0, Math.min(state.sel, items.length - 1));
  if (!items.length) { list.innerHTML = '<li class="empty">В этой теме таких слов нет — выберите другой фильтр или тему.</li>'; return; }
  items.forEach(({ w, i, k }, pos) => {
    const r = state.review[k];
    const li = document.createElement('li');
    li.className = 'row' + (pos === state.sel ? ' sel' : '') + (r ? ' ' + r.status : '');
    li.innerHTML = `<span class="n">${i + 1}</span><span class="ru"></span><span class="kkw"></span><span class="acts">
      <button class="ib" data-a="ok" title="Верно (Enter)" aria-label="Верно">✓</button>
      <button class="ib" data-a="edit" title="Исправить (E)" aria-label="Исправить">✎</button>
      <button class="ib" data-a="rec" title="Записать (R)" aria-label="Записать голос">●</button>
      <button class="ib" data-a="play" title="Прослушать (P)" aria-label="Прослушать">▶</button></span>`;
    const ru = li.querySelector('.ru');
    ru.textContent = r?.status === 'fix' && r.ru && r.ru !== w[0] ? r.ru : w[0];
    if (w[2] || (r?.status === 'fix' && r.hint)) { const s = document.createElement('small'); s.textContent = r?.status === 'fix' && r.hint ? r.hint : w[2]; ru.append(s); }
    const kk = li.querySelector('.kkw');
    if (r?.status === 'fix' && r.kk && r.kk !== w[1]) { const d = document.createElement('del'); d.textContent = w[1]; kk.append(d, r.kk); }
    else kk.textContent = w[1];
    if (r?.note) { const s = document.createElement('span'); s.className = 'note'; s.textContent = r.note; kk.append(s); }
    const b = (a) => li.querySelector(`[data-a="${a}"]`);
    if (r?.status === 'ok') b('ok').classList.add('on-ok');
    if (r?.status === 'fix') b('edit').classList.add('on-fix');
    if (state.audio.has(k)) b('rec').classList.add('has'); else b('play').disabled = true;
    if (recKey === k) b('rec').classList.add('rec');
    li.onclick = (e) => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      state.sel = pos;
      if (a === 'ok') mark(k, w); else if (a === 'edit') edit(k); else if (a === 'rec') toggleRec(k); else if (a === 'play') play(k);
      else if (!e.target.closest('form')) renderList();
    };
    if (state.editing === k) li.append(editForm(k, w, r));
    list.append(li);
  });
  list.children[state.sel]?.scrollIntoView({ block: 'nearest' });
}

function editForm(k, w, r) {
  const f = document.createElement('form'); f.className = 'edit';
  const field = (name, label, value, wide) => {
    const l = document.createElement('label'); if (wide) l.className = 'wide';
    l.textContent = label; const inp = document.createElement('input');
    inp.name = name; inp.id = `f-${name}`; inp.value = value; l.append(inp); f.append(l); return inp;
  };
  const kk = field('kk', 'По-казахски', r?.kk || w[1]);
  field('ru', 'По-русски', r?.ru || w[0]);
  field('hint', 'Подсказка', r?.hint ?? w[2] ?? '', true);
  field('note', 'Комментарий для разработчика (необязательно)', r?.note || '', true);
  const btns = document.createElement('div'); btns.className = 'btns';
  btns.innerHTML = '<button class="btn primary" type="submit">Сохранить правку</button><button class="btn" type="button">Отмена</button>';
  btns.lastChild.onclick = () => { state.editing = null; renderList(); };
  f.append(btns);
  f.onsubmit = (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    save(k, { status: 'fix', ...d }); state.editing = null; next();
  };
  setTimeout(() => kk.focus(), 0);
  return f;
}

async function save(k, body) {
  if (body) state.review[k] = body; else delete state.review[k];
  render();
  try {
    const res = await fetch('/api/review', { method: 'POST', body: JSON.stringify({ key: k, ...(body || {}) }) });
    if (!res.ok) throw 0;
  } catch { toast('Не сохранилось — проверьте, что сервер в терминале запущен'); }
}

function mark(k, w) { save(k, { status: 'ok', ru: w[0], kk: w[1], hint: w[2] || '', note: '' }); next(); }
function edit(k) { state.editing = state.editing === k ? null : k; renderList(); }
function next() { state.sel++; renderList(); }

async function toggleRec(k) {
  if (recorder) { recorder.stop(); return; }
  try {
    stream ??= await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch { toast('Нет доступа к микрофону — разрешите его в адресной строке'); return; }
  chunks = []; recKey = k;
  recorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 32000 });
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' }); const done = recKey;
    recorder = null; recKey = null;
    try {
      const res = await fetch(`/api/audio?key=${done}`, { method: 'POST', body: blob });
      if (!res.ok) throw 0;
      state.audio.add(done); toast('Записано');
    } catch { toast('Запись не сохранилась — попробуйте ещё раз'); }
    next(); render();
  };
  recorder.start(); renderList();
}

function play(k) {
  if (!state.audio.has(k)) return;
  player.src = `/api/audio?key=${k}&t=${Date.now()}`; player.play();
}

const main = () => document.querySelector('main');

document.querySelectorAll('.chip').forEach((b) => b.onclick = () => { state.filter = b.dataset.f; state.sel = 0; render(); });

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input')) { if (e.key === 'Escape') { state.editing = null; renderList(); } return; }
  const items = rows(); const cur = items[state.sel]; if (!cur) return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowDown' || k === 'j') { state.sel = Math.min(state.sel + 1, items.length - 1); renderList(); }
  else if (e.key === 'ArrowUp' || k === 'k') { state.sel = Math.max(state.sel - 1, 0); renderList(); }
  else if (e.key === 'Enter') mark(cur.k, cur.w);
  else if (k === 'e' || k === 'у') edit(cur.k);
  else if (k === 'r' || k === 'к') toggleRec(cur.k);
  else if (k === 'p' || k === 'з') play(cur.k);
  else if (k === 'u' || k === 'г') save(cur.k, null);
  else return;
  e.preventDefault();
});

load().catch(() => $('total').textContent = 'Сервер не отвечает. Запустите: python tools/review/server.py');
</script>
</body>
</html>
